<!doctype html>
<html lang="zh-Hant-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>圖字卡組句 · 第四站</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><div><span class="eyebrow">第四站 · 圖字卡組句</span><h1>我想說</h1></div><nav aria-label="求助及老師工具"><button id="ask-help" class="ask-help"><img src="./assets/help.svg" alt="" draggable="false"><span>請幫我</span></button><button id="focus" aria-pressed="false">專注畫面</button><button id="settings" aria-haspopup="dialog">老師設定</button></nav></header>
<main>
<section class="context" aria-label="日常情境"><div class="context-icon" id="context-icon" aria-hidden="true"></div><div><span class="eyebrow" id="context-label">飲水情境</span><h2 id="cue">口渴了，想飲水。</h2><p>按圖字卡，告訴老師。</p></div><button id="prompt">聽情境</button></section>
<section id="example" class="example" hidden aria-label="句子提示"><span>句子提示</span><strong id="example-text"></strong></section>
<section class="sentence-panel" aria-labelledby="sentence-heading"><div class="section-heading"><h2 id="sentence-heading">我的句子</h2><span>按已選的卡可刪除</span></div><div id="sentence" class="sentence" aria-label="已排列的句子"></div><p id="status" role="status" aria-live="polite">按次序選圖字卡。</p></section>
<section aria-labelledby="cards-heading"><div class="section-heading"><h2 id="cards-heading">圖字卡</h2><span>由左至右組句</span></div><div id="bank" class="bank"></div></section>
<div class="actions"><button id="submit" class="primary" disabled>完成 · 說出句子</button><button id="undo" disabled>退一張</button><button id="clear" disabled>重新排列</button><button id="try" hidden>自己試一試</button></div>
<p id="audio-notice" role="status" hidden>聲音未能播放，仍可展示圖字卡表達。</p>
</main>
<footer><a href="../">返回遊戲室</a><span>點選圖字卡 · 表達需要</span></footer>
<dialog id="teacher-dialog" aria-labelledby="teacher-title"><div class="dialog-heading"><h2 id="teacher-title">老師設定</h2><button id="close-settings">完成設定</button><button id="dialog-help" class="ask-help"><img src="./assets/help.svg" alt=""><span>請幫我</span></button></div><p id="dialog-help-status" role="status" hidden></p><label for="scenario">單一日常情境</label><select id="scenario"><option value="water">飲水</option><option value="toilet">如廁</option><option value="rest">休息</option><option value="help">求助</option></select><label for="card-size">圖字卡大小</label><select id="card-size"><option value="standard">大圖字卡</option><option value="large">特大圖字卡</option></select><label class="check"><input type="checkbox" id="hint">顯示句子提示</label><label class="check"><input type="checkbox" id="sound" checked>播放粵語</label><label for="volume">音量 <output id="volume-out">65%</output></label><input id="volume" type="range" min="0" max="100" step="5" value="65"><button id="demo" class="primary">老師示範句子</button><p>先示範排列，再請學生按「自己試一試」。學生可按「請幫我」求助，或向成人展示句子。</p><p>選卡不用拖拉；iPad 可橫向或直向操作。</p></dialog>
<audio id="speech" preload="auto"></audio>
<script id="icon-assets" type="application/json">{"self": "./assets/self.svg", "want": "./assets/want.svg", "go": "./assets/go.svg", "drink": "./assets/drink.svg", "toilet": "./assets/toilet.svg", "need": "./assets/need.svg", "help": "./assets/help.svg", "rest": "./assets/rest.svg"}</script>
<script id="audio-assets" type="application/json">{
  "self": "./assets/audio/self.wav",
  "want": "./assets/audio/want.wav",
  "go": "./assets/audio/go.wav",
  "drink": "./assets/audio/drink.wav",
  "toilet": "./assets/audio/toilet.wav",
  "need": "./assets/audio/need.wav",
  "help": "./assets/audio/help.wav",
  "rest": "./assets/audio/rest.wav",
  "ask-help": "./assets/audio/ask-help.wav",
  "sentence-water": "./assets/audio/sentence-water.wav",
  "sentence-toilet": "./assets/audio/sentence-toilet.wav",
  "sentence-rest": "./assets/audio/sentence-rest.wav",
  "sentence-help": "./assets/audio/sentence-help.wav",
  "prompt-water": "./assets/audio/prompt-water.wav",
  "prompt-toilet": "./assets/audio/prompt-toilet.wav",
  "prompt-rest": "./assets/audio/prompt-rest.wav",
  "prompt-help": "./assets/audio/prompt-help.wav",
  "retry": "./assets/audio/retry.wav"
}</script>
<script type="module" src="./app.js"></script>
</body></html>
