<!doctype html>
<html lang="zh-Hant-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3eb"><title>運動場追視 · 眼動遊戲室</title><style>@charset "UTF-8";
:root{--paper:#000;--page-ink:#f4f6f8;--page-muted:#bdc8d2;--ink:#153b32;--green:#1d6250;--muted:#596e65;--gold:#efbe47;--border:#d9ded4;--runner-size:8%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--page-ink)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;min-height:48px;font-weight:650}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b16d00;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}button[hidden],[hidden]{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 32px;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;place-items:center;width:48px;height:48px;background:var(--green);color:var(--gold);font-size:42px;border-radius:16px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.5px;color:var(--page-muted)}h1{margin:4px 0 0;font-size:25px;letter-spacing:1px}.tools{display:flex;gap:9px}.tools button{font-size:14px;background:transparent;color:inherit}main{display:flex;gap:28px;padding:26px 32px 20px;max-width:1800px;margin:auto;align-items:flex-start}aside{width:268px;flex:0 0 268px;padding:0 18px 20px 0;border-right:1px solid var(--border)}.panel-heading h2{font-size:24px;margin:8px 0 16px}.routes{display:grid;gap:8px;margin-bottom:22px}.routes button{display:flex;align-items:center;gap:13px;padding:12px;background:transparent;color:inherit;text-align:left}.routes button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white}.routes svg{width:55px;flex:0 0 55px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}.routes small{display:block;font-size:12px;font-weight:400;margin-top:4px;opacity:.8}aside>label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 8px;font-size:14px;font-weight:650}output{font-size:12px;font-weight:500;color:var(--page-muted)}input[type=range]{width:100%;accent-color:var(--green);height:26px;cursor:pointer}.range-labels{display:flex;justify-content:space-between;color:var(--page-muted);font-size:11px}.selects{display:flex;gap:10px;margin-top:17px}.selects label{flex:1;font-size:13px}.selects select{display:block;width:100%;padding:9px 5px;border:1px solid var(--border);border-radius:8px;margin-top:6px;background:#fff;color:var(--ink);min-height:44px}aside>.check{justify-content:flex-start;margin:15px 0 0;font-weight:500}input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}.teacher-note{font-size:12px;line-height:1.8;color:var(--page-muted);margin:15px 0 0}.play{flex:1;min-width:0}.play-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:15px}.play-heading h2{font-size:clamp(18px,2vw,28px);margin:6px 0 0;letter-spacing:1px}.mode-pill{white-space:nowrap;font-size:12px;background:#e6ecdf;border-radius:30px;padding:8px 12px;color:var(--green)}.scene{max-width:min(100%,calc((100svh - 350px)*1.48));margin:0 auto;background:#075335;border-radius:24px;padding:3%;box-shadow:0 12px 28px #173d3220;border:5px solid white;touch-action:none}.field{position:relative;aspect-ratio:2500/1547;isolation:isolate}.stadium{display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}#guide-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#route-path{fill:none;stroke:#ffeb81;stroke-width:5;stroke-dasharray:12 12;stroke-linecap:round}#runner{position:absolute;width:var(--runner-size);aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;pointer-events:none;will-change:left,top}.runner-disc{width:100%;height:100%;border-radius:50%;border:4px solid #ffdb65;background:white;box-shadow:0 4px 12px #042b3770;display:grid;place-items:center;overflow:hidden}#portrait{width:90%;height:90%;object-fit:contain;user-select:none;pointer-events:none;transform:scaleX(var(--facing,1)) translateY(var(--bob,0px))}body[data-state=running] .runner-disc{border-color:#fff6bf;box-shadow:0 0 0 4px #ffdb6590,0 4px 12px #042b3770}.activity-bar{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:14px}.activity-bar #status{font-weight:650}.activity-bar #counter{color:var(--page-muted);white-space:nowrap}progress{appearance:none;display:block;width:100%;height:5px;border:0;border-radius:8px;margin:13px 0 20px;overflow:hidden;background:#dce1d5}progress::-webkit-progress-bar{background:#dce1d5}progress::-webkit-progress-value{background:var(--green)}progress::-moz-progress-bar{background:var(--green)}.play-controls{display:flex;align-items:center;gap:10px}.primary{background:var(--green);color:white;border-color:var(--green);min-width:165px}.key-hint{margin-left:auto;font-size:12px;color:var(--page-muted)}footer{display:flex;justify-content:space-between;font-size:12px;color:var(--page-muted);padding:12px 32px 20px;max-width:1800px;margin:auto}#celebration{color:var(--ink);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#fff8e6;padding:18px 32px;border-radius:20px;box-shadow:0 5px 20px #14352940;pointer-events:none;width:max-content;max-width:70%}#celebration>span{font-size:40px;color:#b87500}#celebration h2{margin:4px 0;font-size:28px}#celebration p{margin:5px 0;font-size:13px}#load-error{color:#ffaaa3;font-size:14px}
body.focus .brand,body.focus #fullscreen,body.focus .play-heading,body.focus aside,body.focus footer,body.focus .key-hint{display:none}body.focus .topbar{justify-content:flex-end;padding:8px 20px;border:0}body.focus main{padding:0 20px 12px;max-width:1500px}body.focus .scene{max-width:calc((100svh - 200px)*1.5);margin:auto;padding:2%;border-radius:16px}body.focus .activity-bar,body.focus .play-controls,body.focus progress{max-width:1200px;margin-left:auto;margin-right:auto}body.focus .runner-disc{border-width:3px}body.panel-closed aside{display:none}body.panel-closed main{max-width:1600px}.scene:fullscreen{border:0;border-radius:0;display:grid;place-items:center;padding:3%;width:100vw;height:100vh}.scene:fullscreen .field{width:min(100%,calc(92vh * 1.616));max-height:92vh}
@media(max-width:1000px){.topbar{padding:16px 20px}main{padding:20px;gap:20px}aside{width:228px;flex-basis:228px}.mode-pill{display:none}.key-hint{display:none}h1{font-size:22px}footer{padding:12px 20px}.tools button{padding:10px}}
@media(max-width:700px){.topbar{flex-wrap:wrap;gap:12px}.tools{width:100%}.tools button{flex:1;font-size:13px;padding:9px}main{flex-direction:column;padding:16px;gap:22px}.play{width:100%;order:0}aside{width:100%;flex-basis:auto;order:1;border:0;border-top:1px solid var(--border);padding:20px 0 0}.routes{grid-template-columns:repeat(3,1fr);gap:6px}.routes button{flex-direction:column;text-align:center;padding:10px 5px;gap:7px;font-size:13px}.routes small{font-size:10px}.routes svg{height:26px;flex-basis:auto;width:42px}.scene{max-width:none;border-radius:15px;border-width:3px}.runner-disc{border-width:2px}.activity-bar{font-size:12px;gap:6px}.play-controls button{font-size:14px;padding:12px}.primary{min-width:155px}footer span{display:none}body.focus main{padding:0 12px 12px}body.focus .topbar .tools{width:auto}body.focus .scene{padding:3%}#celebration{padding:8px 14px}#celebration>span{font-size:20px}#celebration h2{font-size:19px}#celebration p{font-size:10px}}
@media(prefers-reduced-motion:reduce){#portrait{transform:scaleX(var(--facing,1))}}
</style></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">◎</span><div><span class="eyebrow">眼動遊戲室 · 第一站</span><h1>運動場追視</h1></div></div><div class="tools"><button id="focus" aria-pressed="false">專注畫面</button><button id="fullscreen">全螢幕</button><button id="settings" aria-expanded="true">老師設定</button></div></header>
<main>
<aside id="panel" aria-label="老師設定">
<div class="panel-heading"><span class="eyebrow">先設定，再一起跑</span><h2>選一條跑道</h2></div>
<div class="routes" role="group" aria-label="追視路線">
<button data-route="full" aria-pressed="true"><svg viewBox="0 0 80 44" aria-hidden="true"><rect x="5" y="6" width="70" height="32" rx="16"/></svg><span>全圓追視<small>跑完完整一圈</small></span></button>
<button data-route="upper" aria-pressed="false"><svg viewBox="0 0 80 44" aria-hidden="true"><path d="M5 30 A16 16 0 0 1 21 14 H59 A16 16 0 0 1 75 30"/></svg><span>上半圓<small>沿上半邊跑道</small></span></button>
<button data-route="lower" aria-pressed="false"><svg viewBox="0 0 80 44" aria-hidden="true"><path d="M5 14 A16 16 0 0 0 21 30 H59 A16 16 0 0 0 75 14"/></svg><span>下半圓<small>沿下半邊跑道</small></span></button>
</div>
<label for="duration">跑步速度 <output id="speedout">慢速 · 40 秒</output></label><input id="duration" type="range" min="16" max="80" step="4" value="40"><div class="range-labels"><span>較快</span><span>較慢</span></div>
<label for="size">人物大小 <output id="sizeout">標準</output></label><input id="size" type="range" min="6" max="12" step="1" value="8">
<div class="selects"><label>完成目標<select id="laps"><option value="1">1 圈／段</option><option value="2">2 圈／段</option><option value="3">3 圈／段</option></select></label><label>跑步方向<select id="direction"><option value="forward">正向</option><option value="reverse">反向</option></select></label></div>
<label class="check"><input type="checkbox" id="guide">顯示路線提示</label><label class="check"><input type="checkbox" id="sound" checked>跑步及慶祝音效</label>
<label for="volume">音量 <output id="volumeout">30%</output></label><input id="volume" type="range" min="0" max="70" step="5" value="30">
<p class="teacher-note">先按「準備開始」。學生把眼動游標移到人物上便會跑，離開即停。</p><p id="soundnotice" class="teacher-note" hidden></p>
</aside>

<div class="play-heading"><div><span class="eyebrow" id="route-label">全圓追視</span><h2>望住運動員，一起跑。</h2></div><span class="mode-pill">游標碰到即跑</span></div>

<script>const course = Object.freeze({ left:270, right:730, cy:347, radius:224, width:1000, height:618.8 });
const quarter = Math.PI * course.radius / 2;
const straight = course.right - course.left;
const halfLength = 2 * quarter + straight;
const paths = {
  upper: 'M46 347 A224 224 0 0 1 270 123 H730 A224 224 0 0 1 954 347',
  lower: 'M46 347 A224 224 0 0 0 270 571 H730 A224 224 0 0 0 954 347',
  full: 'M46 347 A224 224 0 0 1 270 123 H730 A224 224 0 0 1 954 347 A224 224 0 0 1 730 571 H270 A224 224 0 0 1 46 347'
};
function halfPoint(distance, lower) {
  const sign = lower ? -1 : 1;
  let angle, cx;
  if (distance <= quarter) { cx=course.left; angle=Math.PI + sign*distance/course.radius; }
  else if (distance <= quarter+straight) return {x:course.left+distance-quarter,y:course.cy-sign*course.radius};
  else { cx=course.right; angle=(lower ? Math.PI/2 : Math.PI*1.5) + sign*(distance-quarter-straight)/course.radius; }
  return {x:cx+course.radius*Math.cos(angle), y:course.cy+course.radius*Math.sin(angle)};
}
function trackPoint(mode, progress, reverse=false) {
  if (!Object.hasOwn(paths,mode)) throw new Error('Unknown track mode');
  if (!Number.isFinite(progress)) throw new Error('Progress must be finite');
  let p=Math.max(0,Math.min(1,progress));
  if(reverse) p=1-p;
  if(mode==='upper') return halfPoint(p*halfLength,false);
  if(mode==='lower') return halfPoint(p*halfLength,true);
  const distance=p*halfLength*2;
  return distance<=halfLength ? halfPoint(distance,false) : halfPoint(halfLength*2-distance,true);
}

// Use the media playback session on iPad; older browsers keep their default.
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch{}
const $=id=>document.getElementById(id);
const routeNames={full:'全圓追視',upper:'上半圓追視',lower:'下半圓追視'};
const defaults={route:'full',duration:40,size:8,laps:1,direction:'forward',guide:false,sound:true,volume:30};
const storageKey='fox-athletics-settings-v1';
let settings={...defaults};
try {
  const stored=JSON.parse(localStorage.getItem(storageKey)||'null');
  if(stored && typeof stored==='object') {
    for(const [key,min,max] of [['duration',16,80],['size',6,12],['laps',1,3],['volume',0,70]])
      if(typeof stored[key]==='number' && Number.isFinite(stored[key])) settings[key]=Math.max(min,Math.min(max,Math.round(stored[key])));
    if(Object.hasOwn(routeNames,stored.route)) settings.route=stored.route;
    if(['forward','reverse'].includes(stored.direction)) settings.direction=stored.direction;
    for(const key of ['guide','sound']) if(typeof stored[key]==='boolean') settings[key]=stored[key];
  }
} catch { /* Settings storage is optional. */ }
let armed=false,finished=false,loaded=false,elapsed=0,lastTime=0,moving=false,stepTime=0;
let pointer=null,point=trackPoint(settings.route,0,settings.direction==='reverse');
let context=null,gain=null,voices=new Set();
function save(){try{localStorage.setItem(storageKey,JSON.stringify(settings));}catch{}}
function silence(){for(const voice of voices){try{voice.stop();}catch{}}voices.clear();}
async function enableAudio(){
  if(!settings.sound) return;
  try {
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio) throw new Error('Audio unavailable');
    if(!context){context=new Audio();gain=context.createGain();gain.connect(context.destination);}
    gain.gain.value=settings.volume/100;
    await context.resume();
    $('soundnotice').hidden=context.state==='running';
    if(context.state!=='running') $('soundnotice').textContent='聲音未啟用，請再按一次準備開始。';
  } catch {$('soundnotice').hidden=false;$('soundnotice').textContent='這個瀏覽器未能啟用音效，遊戲仍可繼續。';}
}
function tone(freq,when,length,level,type='sine'){
  if(!settings.sound||!context||context.state!=='running'||!gain) return;
  const osc=context.createOscillator(),envelope=context.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,when);
  envelope.gain.setValueAtTime(0,when);envelope.gain.linearRampToValueAtTime(level,when+0.008);
  envelope.gain.exponentialRampToValueAtTime(0.001,when+length);
  osc.connect(envelope);envelope.connect(gain);voices.add(osc);
  osc.onended=()=>{voices.delete(osc);osc.disconnect();envelope.disconnect();};
  osc.start(when);osc.stop(when+length+0.02);
}
function footsteps(){if(context) tone(stepTime%2 ? 130 : 95,context.currentTime,0.075,0.18,'triangle');}
function celebrate(){if(context) [523.25,659.25,783.99,1046.5].forEach((note,i)=>tone(note,context.currentTime+i*0.16,i===3?0.65:0.19,0.18));}
function units(){return settings.route==='full'?'圈':'段';}
function currentProgress(){return Math.min(elapsed/(settings.duration*settings.laps),1);}
function render(){
  const traversals=elapsed/settings.duration;
  const phase=finished ? 1 : traversals%1;
  const segment=finished ? settings.laps-1 : Math.floor(traversals);
  const reverse=(settings.direction==='reverse') !== (settings.route!=='full' && segment%2===1);
  point=trackPoint(settings.route,phase,reverse);
  $('runner').style.left=(point.x/course.width*100)+'%';
  $('runner').style.top=(point.y/course.height*100)+'%';
  const nearby=trackPoint(settings.route,Math.min(1,phase+0.001),reverse);
  const previous=trackPoint(settings.route,Math.max(0,phase-0.001),reverse);
  if(Math.abs(nearby.x-previous.x)>0.00001) $('portrait').style.setProperty('--facing',nearby.x>previous.x?'1':'-1');
  $('portrait').style.setProperty('--bob',moving?(Math.sin(elapsed*18)*1.5)+'px':'0px');
  $('progress').value=currentProgress();
  $('counter').textContent=`${finished?settings.laps:Math.min(Math.floor(traversals),settings.laps)} / ${settings.laps} ${units()}`;
  document.body.dataset.progress=currentProgress().toFixed(6);
  document.body.dataset.phase=phase.toFixed(6);
}
function pointerOnRunner(){
  if(!pointer) return false;
  const rect=$('runner').getBoundingClientRect();
  return Math.hypot(pointer.x-(rect.left+rect.width/2),pointer.y-(rect.top+rect.height/2))<=Math.min(rect.width,rect.height)/2;
}
function updateStatus(){
  const state=finished?'complete':!armed?'idle':moving?'running':'waiting';
  const changed=document.body.dataset.state!==state;
  document.body.dataset.state=state;
  if(!changed) return;
  $('status').textContent=finished?'完成了！可以休息，或再跑一次。':!armed?'準備好，先由老師按開始。':moving?'跟望中，運動員正在跑。':'望住運動員便會跑，離開即停。';
  $('start').innerHTML=finished?'再跑一次':armed?'<span aria-hidden="true">Ⅱ</span> 暫停':'<span aria-hidden="true">▶</span> 準備開始';
  $('celebration').hidden=!finished;
}
function pause(){armed=false;moving=false;pointer=null;silence();updateStatus();render();}
function reset(){pause();elapsed=0;finished=false;stepTime=0;updateStatus();render();}
async function toggle(){
  if(!loaded) return;
  if(armed){pause();return;}
  if(finished) reset();
  // The teacher's click/key press unlocks audio before eye-gaze hover starts.
  enableAudio();
  armed=true;lastTime=performance.now();updateStatus();
}
function syncSettings(){
  for(const key of ['duration','size','laps','volume']) $(key).value=settings[key];
  $('direction').value=settings.direction;
  for(const key of ['guide','sound']) $(key).checked=settings[key];
  document.querySelectorAll('[data-route]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.route===settings.route?'true':'false'));
  $('route-label').textContent=routeNames[settings.route];
  $('route-path').setAttribute('d',paths[settings.route]);$('guide-layer').toggleAttribute('hidden',!settings.guide);
  document.documentElement.style.setProperty('--runner-size',settings.size+'%');
  $('speedout').textContent=(settings.duration>=40?'慢速':settings.duration>=28?'中速':'較快')+' · '+settings.duration+' 秒';
  $('sizeout').textContent=settings.size<8?'較小':settings.size>9?'較大':'標準';
  $('volumeout').textContent=settings.volume+'%';
  if(gain) gain.gain.value=settings.volume/100;
  render();
}
function frame(now){
  const dt=lastTime?Math.min(Math.max((now-lastTime)/1000,0),0.06):0;lastTime=now;
  const wasMoving=moving;
  moving=armed&&!finished&&loaded&&pointerOnRunner();
  if(moving){
    elapsed+=dt;
    if(elapsed>=settings.duration*settings.laps){elapsed=settings.duration*settings.laps;finished=true;armed=false;moving=false;silence();celebrate();}
    else if(elapsed>=stepTime*0.32){footsteps();stepTime=Math.floor(elapsed/0.32)+1;}
    render();
    // Recheck the moving hit area even if the operating system sends no new pointer event.
    if(!finished&&!pointerOnRunner()) moving=false;
  }
  if(wasMoving&&!moving&&!finished) silence();
  updateStatus();requestAnimationFrame(frame);
}
$('start').addEventListener('click',toggle);
$('reset').addEventListener('click',reset);
$('scene').addEventListener('pointermove',event=>{if(event.pointerType!=='touch')pointer={x:event.clientX,y:event.clientY};});
$('scene').addEventListener('pointerleave',()=>{pointer=null;moving=false;silence();updateStatus();});
$('scene').addEventListener('pointercancel',()=>{pointer=null;moving=false;silence();updateStatus();});
window.addEventListener('blur',()=>{if(armed)pause();});
window.addEventListener('resize',()=>{pointer=null;moving=false;silence();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&armed)pause();});
for(const button of document.querySelectorAll('[data-route]')) button.addEventListener('click',()=>{settings.route=button.dataset.route;reset();syncSettings();save();});
for(const key of ['duration','size','volume']) $(key).addEventListener('input',()=>{settings[key]=Number($(key).value);if(key==='duration')reset();syncSettings();save();});
for(const key of ['direction','laps']) $(key).addEventListener('change',()=>{settings[key]=key==='laps'?Number($(key).value):$(key).value;reset();syncSettings();save();});
for(const key of ['guide','sound']) $(key).addEventListener('change',()=>{settings[key]=$(key).checked;if(key==='sound'){if(settings.sound)enableAudio();else silence();}syncSettings();save();});
$('focus').addEventListener('click',()=>{document.body.classList.toggle('focus');document.body.classList.add('panel-closed');$('focus').setAttribute('aria-pressed',document.body.classList.contains('focus')?'true':'false');$('settings').setAttribute('aria-expanded','false');pointer=null;});
$('settings').addEventListener('click',()=>{pause();if(document.body.classList.contains('focus'))document.body.classList.remove('focus');document.body.classList.toggle('panel-closed');$('focus').setAttribute('aria-pressed','false');$('settings').setAttribute('aria-expanded',document.body.classList.contains('panel-closed')?'false':'true');});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('status').textContent='此瀏覽器未能全螢幕，可使用專注畫面。';}});
document.addEventListener('keydown',event=>{
  if(event.target.closest('input,select,textarea,button')||event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.code==='Space'){event.preventDefault();if(!event.repeat)toggle();}
  if(event.key==='r'||event.key==='R')reset();
  if(event.key==='Escape'){document.body.classList.remove('focus');$('focus').setAttribute('aria-pressed','false');}
});
async function loadImages(){
  try{await Promise.all(['stadium','portrait'].map(id=>$(id).decode()));loaded=true;$('start').disabled=false;}
  catch{$('load-error').hidden=false;loaded=false;$('start').disabled=true;}
}
syncSettings();updateStatus();loadImages();requestAnimationFrame(frame);
</script>
</body></html>
