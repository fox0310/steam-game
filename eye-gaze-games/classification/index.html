<!doctype html>
<html lang="zh-Hant-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>找一找 · 動物植物死物分類</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><h1>找<span id="target-name">動物</span></h1><button id="settings" aria-haspopup="dialog">老師設定</button></header>
<main id="stage" tabindex="-1">
 <figure class="picture"><img id="picture" alt="" draggable="false"><figcaption id="item-name"></figcaption></figure>
 <section id="feedback" class="feedback" aria-live="polite" hidden><div><h2 id="feedback-title"></h2><p id="feedback-feature"></p><p id="feedback-encourage"></p></div></section>
 <p id="status" role="status">圖片準備中…</p>
 <div class="actions"><button id="answer" class="primary" disabled>這是目標 · 空白鍵</button></div>
 <p id="audio-notice" role="status" hidden>聲音未能播放，請看圖片的特徵說明。</p>
 <button id="continue" hidden>繼續看圖片</button>
</main>
<dialog id="teacher-dialog" aria-labelledby="teacher-title"><div class="dialog-heading"><h2 id="teacher-title">老師設定</h2><button id="close-settings">返回遊戲</button></div>
 <label for="target">學生要分辨的目標</label><select id="target"><option value="animal">動物</option><option value="plant">植物</option><option value="object">死物</option></select>
 <label class="check"><input type="checkbox" id="sound" checked>播放粵語及答對音效</label>
 <label for="volume">音量 <output id="volume-out">65%</output></label><input id="volume" type="range" min="0" max="100" step="5" value="65">
 <div class="teacher-actions"><button id="start" class="primary" disabled>開始遊戲</button><button id="restart" disabled>重新開始</button><button id="prompt">聽目標</button><a href="../">返回遊戲室</a></div>
 <section class="teacher-note"><h3>辨認特徵</h3><p><strong>動物：</strong>會成長、活動，會對外界刺激有反應。本遊戲的貓、狗和小鳥亦會叫。</p><p><strong>植物：</strong>會成長，不會像動物自行走動或叫；植物仍會對光線或觸碰等刺激有反應。</p><p><strong>死物：</strong>本遊戲的玩具車、皮球、椅子不會成長，亦不會自己活動或回應呼喚。物件可被人推動，不能只靠「有沒有動」分類。</p></section>
 <p>每張圖片只接受一次作答。拍掣需設定為空白鍵；按下後放開，再回答下一張。老師設定及切換視窗會暫停。</p>
</dialog>
<audio id="speech" preload="auto"></audio>
<script id="icon-assets" type="application/json">{"cat": "./assets/cat.svg", "dog": "./assets/dog.svg", "bird": "./assets/bird.svg", "flower": "./assets/flower.svg", "tree": "./assets/tree.svg", "cactus": "./assets/cactus.svg", "toy": "./assets/toy.svg", "ball": "./assets/ball.svg", "chair": "./assets/chair.svg"}</script>
<script id="audio-assets" type="application/json">{
  "prompt-animal": "./assets/audio/prompt-animal.wav",
  "prompt-plant": "./assets/audio/prompt-plant.wav",
  "prompt-object": "./assets/audio/prompt-object.wav",
  "correct-cat": "./assets/audio/correct-cat.wav",
  "wrong-cat": "./assets/audio/wrong-cat.wav",
  "correct-dog": "./assets/audio/correct-dog.wav",
  "wrong-dog": "./assets/audio/wrong-dog.wav",
  "correct-bird": "./assets/audio/correct-bird.wav",
  "wrong-bird": "./assets/audio/wrong-bird.wav",
  "correct-flower": "./assets/audio/correct-flower.wav",
  "wrong-flower": "./assets/audio/wrong-flower.wav",
  "correct-tree": "./assets/audio/correct-tree.wav",
  "wrong-tree": "./assets/audio/wrong-tree.wav",
  "correct-cactus": "./assets/audio/correct-cactus.wav",
  "wrong-cactus": "./assets/audio/wrong-cactus.wav",
  "correct-toy": "./assets/audio/correct-toy.wav",
  "wrong-toy": "./assets/audio/wrong-toy.wav",
  "correct-ball": "./assets/audio/correct-ball.wav",
  "wrong-ball": "./assets/audio/wrong-ball.wav",
  "correct-chair": "./assets/audio/correct-chair.wav",
  "wrong-chair": "./assets/audio/wrong-chair.wav"
}
</script>
<script type="module" src="./app.js"></script>
</body></html>
