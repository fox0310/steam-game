name: Deploy classroom apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "face-trigger/**"
      - "eye-gaze-games/**"
      - ".github/workflows/face-trigger-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble classroom apps
        run: node eye-gaze-games/build-pages.cjs "${RUNNER_TEMP}/classroom-pages"
      - name: Upload classroom apps
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/classroom-pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
